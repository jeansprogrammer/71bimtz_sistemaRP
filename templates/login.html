<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>71 BI Mtz — Login</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='simbolo.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --verde-escuro: #1a3510;
            --amarelo: #c8a83c;
            --amarelo-claro: #e8c84c;
            --cinza-bg: #0f1410;
            --cinza-card: #161e12;
            --cinza-borda: #2a3a22;
            --cinza-texto: #8a9e80;
            --branco: #e8eed4;
            --vermelho: #8b2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--cinza-bg);
            color: var(--branco);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url("{{ url_for('static', filename='logo_comsoc.png') }}");
            background-position: center center;
            background-size: 60% auto;
            background-repeat: no-repeat;
            opacity: 0.05;
            filter: blur(2px);
            pointer-events: none;
        }

        .box {
            position: relative;
            z-index: 1;
            background: var(--cinza-card);
            border: 1px solid var(--cinza-borda);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .box img {
            height: 64px;
            margin-bottom: 0.75rem;
        }

        .box h1 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 3px;
            color: var(--amarelo);
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
        }

        .box p.sub {
            color: var(--cinza-texto);
            font-size: 0.72rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cinza-texto);
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            background: #0a0f08;
            border: 1px solid var(--cinza-borda);
            border-radius: 4px;
            color: var(--branco);
            padding: 0.7rem 0.9rem;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: var(--amarelo);
        }

        button {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--amarelo);
            color: var(--verde-escuro);
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        button:hover {
            background: var(--amarelo-claro);
        }

        .erro {
            background: rgba(139, 42, 42, 0.25);
            border: 1px solid var(--vermelho);
            color: #e8a;
            padding: 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="{{ url_for('static', filename='logo_71bi.png') }}" alt="71 BI Mtz">
        <h1>71 BI Mtz</h1>
        <p class="sub">Controle de Acesso de Civis</p>
        {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" autocomplete="current-password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>

</html>
